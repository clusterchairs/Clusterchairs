<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/image/logo.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/image/logo.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/image/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe-Furniture</title>
    <script src="/utils.js"></script>
    <script src="/auth.js"></script>
    <script src="/cart-logic.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f2f4;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgb(121, 65, 65);
            padding: 10px 20px;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            height: 70px;
            width: auto;
        }

        .location {
            font-size: 28px;
            font-family: "Protest Strike", sans-serif;
            margin-left: 12px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #febd69;
        }

        .cart {
            height: 36px;
            vertical-align: middle;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            font-size: 26px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        /* Cards */
        .card-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            justify-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 14px;
            text-align: center;
            max-width: 280px;
            width: 100%;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            margin: 8px 0;
        }

        .add-to-cart-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: rgb(121, 65, 65);
            color: #fff;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            background: #a05252;
        }

        /* Responsive Rules */
        @media (max-width: 992px) {
            .card-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .logo img {
                height: 60px;
            }

            .location {
                font-size: 22px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-wrap: wrap;
            }

            .hamburger {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background: rgb(121, 65, 65);
                padding: 12px 0;
            }

            .nav-links.active {
                display: flex;
            }

            .card-container {
                grid-template-columns: 1fr;
            }

            .location {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo img {
                height: 50px;
            }

            .location {
                font-size: 18px;
            }

            .card img {
                width: 120px;
                height: 120px;
            }

            .nav-links a {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
