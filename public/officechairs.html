    <style>
        /* BASE STYLES */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* --- NAVBAR STYLES --- */
        .navbar {
            display: flex;
            align-items: center;
            background: rgb(121, 65, 65);
            color: #fff;
            padding: 10px 20px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .logo img {
            height: 60px;
            width: auto;
        }

        .location {
            font-size: 32px;
            /* Adjusted desktop size for better fitting */
            margin-left: 15px;
            font-family: 'Protest Strike', sans-serif;
            flex-grow: 1;
            /* Pushes links to the right */
        }

        /* Desktop Nav Links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease-in-out;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            transition: color 0.2s;
        }

        .cart {
            height: 40px;
            vertical-align: middle;
        }

        /* --- HAMBURGER MENU STYLES --- */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            z-index: 1001;
            padding: 5px;
        }

        .hamburger span {
            height: 3px;
            width: 25px;
            background: #fff;
            margin: 4px 0;
            border-radius: 5px;
            transition: 0.3s;
        }

        .cardone button {
            width: 120px;
            padding: 10px 0;
            border: none;
            border-radius: 6px;
            background: #7a3f3f;
            /* Brown color like your sample */
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .cardone button:hover {
            background: #4f2a2a;
            /* Darker on hover */
        }

        /* --- CARD GRID STYLES --- */
        .card-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            justify-items: center;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
            max-width: 1200px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 320px;
            min-height: 380px;
            /* Increased min-height for uniformity */
            padding: 14px 10px 18px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .card p {
            flex-grow: 1;
            /* Pushes the button to the bottom */
        }

        .card img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
            background: #fff;
        }

        .card .add-to-cart-btn {
            margin-top: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: rgb(121, 65, 65);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .card .add-to-cart-btn:hover {
            background: #a05252;
        }

        /*
        |--------------------------------------------------------------------------
        | MEDIA QUERIES
        |--------------------------------------------------------------------------
        */

        /* Tablet View (Max 1024px) */
        @media (max-width: 1024px) {
            .card-container {
                grid-template-columns: repeat(2, 1fr);
                /* 2 cards inline */
                gap: 20px;
            }
        }

        /* Mobile View (Max 768px) */
        @media (max-width: 768px) {

            /* Hide desktop nav links */
            .nav-links {
                /* Start with links hidden */
                display: none;
            }

            /* Show hamburger icon */
            .hamburger {
                display: flex;
            }

            .location {
                font-size: 24px;
            }

            .navbar .logo img {
                height: 50px;
            }

            /* Mobile Menu ACTIVE STATE (Overlay) */
            .nav-links.show {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 70px;
                /* Adjusted based on navbar height */
                left: 0;
                width: 100%;
                height: 100vh;
                background: rgb(80, 40, 40);
                padding: 20px 0;
                text-align: center;
                z-index: 999;
                gap: 30px;
            }

            /* Mobile: 1 card inline */
            .card-container {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 20px auto;
            }

            .card {
                min-height: auto;
            }
        }
    </style>
</head>
