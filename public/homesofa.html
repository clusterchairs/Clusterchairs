<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/image/logo.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/image/logo.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/image/logo.png">
    <title>homesofa</title>
    <link rel="stylesheet" href="/office.css">
    <script src="/utils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
    <style>
        /* BASE STYLES (Desktop First) */
        .navbar {
            display: flex;
            align-items: center;
            background: rgb(121, 65, 65);
            color: #fff;
            padding: 10px 20px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .logo img {
            height: 70px;
            width: auto;
        }

        .location {
            font-size: 50px;
            /* Large size for desktop */
            margin-left: 20px;
            /* Reduced margin from 270px for better centering/flow */
            font-family: 'Protest Strike', sans-serif;
            line-height: 1.1;
            letter-spacing: 2px;
            flex-grow: 1;
            /* Allows it to push the nav links to the right */
        }

        /* Nav links (Desktop Default: Row) */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            /* Use gap for spacing instead of margin-left on every link */
            transition: all 0.3s ease-in-out;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            /* Standardizing desktop link size */
            transition: color 0.2s;
            margin-left: 0;
            /* Resetting unnecessary margin-left */
        }

        .nav-links a:hover {
            color: #febd69;
        }

        .cart {
            width: 40px;
            vertical-align: middle;
            margin-top: 0 !important;
            /* Fixing inline style clash */
        }

        /* Hamburger (Hidden by default) */
        .hamburger {
            display: none;
            font-size: 28px;
            cursor: pointer;
            color: #fff;
            padding: 5px;
        }

        /* --- CARD GRID STYLES --- */
        .card-container,
        .special-card {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* Setting a clear desktop default: 4 columns */
            gap: 24px;
            justify-items: center;
            margin: 40px auto;
            max-width: 1400px;
            /* Optional max width for large screens */
            padding: 0 20px;
            box-sizing: border-box;
        }

        .cardone {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            min-height: 380px;
            /* Ensure cards have similar height */
            padding: 14px 10px 18px 10px;
            text-align: center;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .cardone img {
            width: 250px;
            height: 250px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
            background: #fff;
        }

        /* The styles below are for the action buttons/text, which are fine */
        .cardone h3 {
            margin-bottom: 12px;
        }

        .cardone .price {
            margin-bottom: 14px;
            margin-top: 0;
        }

        .cardone p {
            flex-grow: 1;
        }

        /* Added to push the button down */

        .cardone .add-to-cart-btn {
            margin-top: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: rgb(121, 65, 65);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cardone .add-to-cart-btn:hover {
            background: #a05252;
        }

        /* Clearing up unnecessary/duplicate classes in HTML by styling the containers directly */
        .AE823,
        .last-row,
        .aldo {
            /* These wrappers aren't needed for the grid flow but are harmless if kept */
            width: 100%;
            display: contents;
            /* Allows the children to participate directly in the grid */
        }


        /*
        |--------------------------------------------------------------------------
        | MEDIA QUERIES
        |--------------------------------------------------------------------------
        */

        /* Tablet View (Max 1024px) */
        @media (max-width: 1024px) {

            .card-container,
            .special-card {
                grid-template-columns: repeat(3, 1fr);
                /* 3 columns on tablet */
                gap: 16px;
            }

            .location {
                font-size: 35px;
            }
        }

        /* Mobile View (Max 768px) */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
            }

            .location {
                font-size: 20px;
                margin-left: 10px;
            }

            .logo img {
                height: 50px;
            }

            /* Show the hamburger icon and hide default links */
            .hamburger {
                display: block;
            }

            .nav-links {
                /* Mobile menu overlay */
                position: fixed;
                top: 70px;
                right: 0;
                width: 100%;
                height: calc(100vh - 70px);
                background: rgb(80, 40, 40);
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                transform: translateX(100%);
                /* Hidden off-screen */
                padding-top: 40px;
            }

            .nav-links.active {
                display: flex;
                /* Override display: none from initial mobile state */
                transform: translateX(0);
                /* Slide in */
            }

            .nav-links a {
                font-size: 20px;
                margin: 15px 0;
            }

            /* Product Grid: 2 columns on mobile/small tablets */
            .card-container,
            .special-card {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 0 10px;
            }

            .cardone {
                min-height: 320px;
                padding: 10px;
            }

            .cardone img {
                width: 150px;
                height: 150px;
            }
        }

        /* Very Small Mobile View (Max 480px) */
        @media (max-width: 480px) {
            .location {
                display: none;
                /* Hide text for very small screens, keeping only logo */
            }

            /* Product Grid: 1 column */
            .card-container,
            .special-card {
                grid-template-columns: 1fr;
            }

            .cardone {
                max-width: 95%;
                /* Allow full width */
            }
        }
    </style>
</head>

<body>
    <script src="/auth.js"></script>
    <script src="/cart-logic.js"></script>
    <header class="navbar">
        <a href="/index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
            <div class="logo"><img src="/image/logo.png" alt="Logo"></div>
            <div class="location">Cluster Chairs</div>
        </a>

        <div class="hamburger" id="hamburger">
            ☰
        </div>

        <div class="nav-links" id="nav-links">
            <a href="/login.html" id="account-link">Account & Lists</a>
            <a href="#" id="logout-link" style="display: none;">Logout</a>
            <a href="/cart.html">
                <img src="/image/cartimage.png" class="cart">
                <span id="cart-count"
                    style="color: #fff; border-radius: 50%; padding: 2px; margin-left: 4px; font-size: 20px;">0</span>
            </a>
        </div>
    </header>

    <div class="special-card" id="product-container"></div>

    <div id="cart-popup"
        style=" display:none; position:fixed; top:30px; right:30px; background:#232f3e; color:#fff; padding:16px 32px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15); font-size:1.1em; z-index:9999; transition:opacity 0.3s;">
    </div>

    <script>

        const products = [
            { name: "AE 823", price: 30000, img: "/image/AE 823.png", desc: "Comfortable wooden chair for cafes." },
            { name: "AE 824", price: 30000, img: "/image/AE 824.png", desc: "Stylish table for your cafe space." },
            { name: "AE 825", price: 30000, img: "/image/AE 825.png", desc: "Comfortable wooden chair for cafes." },
            { name: "AE 826", price: 30000, img: "/image/AE 826.png", desc: "Stylish table for your cafe space." },
            { name: "AE 827", price: 30000, img: "/image/AE 827.png", desc: "Comfortable wooden chair for cafes." },
            { name: "AE 828", price: 40000, img: "/image/AE 828.png", desc: "Stylish table for your cafe space." },
            { name: "New Port", price: 37000, img: "/image/New Port.png", desc: "Fabric Sofa | Metal Frame Leg | Wooden Structure THREE 75\" x 32\"" },
            { name: "Aldo", price: 37000, img: "/image/aldo.png", desc: "Composite Leather & Fabric | Wooden Frame | Steel Legs THREE 72\" x 30\"" },
            { name: "Hamilton", price: 41000, img: "/image/hamilton.png", desc: "THREE 78\" x 34\"" },
            { name: "Neptune", price: 41000, img: "/image/neptune.png", desc: "THREE 80\" x 34\"" },
            { name: "Hilton", price: 41000, img: "/image/hilton.png", desc: "Composite Leather | Wooden Frame | Wooden Legs THREE 75\" x 32\"" },
            { name: "Hercules", price: 41000, img: "/image/hercules.png", desc: "THREE 80\" x 34\"" },
            { name: "Nivea", price: 41000, img: "/image/nivea.png", desc: "THREE 75\" x 33\"" },
            { name: "Athena", price: 42000, img: "/image/Athena.png", desc: "THREE 75\" x 33\"" },
            { name: "Zeus", price: 41000, img: "/image/Zeus.png", desc: "THREE 75\" x 32\"" },
            { name: "OZI", price: 42000, img: "/image/OZI.png", desc: "THREE 80\" x 34\"" },
            { name: "Kraby", price: 39000, img: "/image/Kraby.png", desc: "THREE 78\" x 34\"" },
            { name: "Grezza", price: 44000, img: "/image/Grezza.png", desc: "THREE 75\" x 32\"" },
            { name: "Dyno", price: 39000, img: "/image/dyno.png", desc: "THREE 75\" x 32\"" },
            { name: "Roger", price: 39000, img: "/image/Roger.png", desc: "THREE 75\" x 32\"" },
            { name: "ONIX", price: 39000, img: "/image/onix.png", desc: "THREE 75\" x 32\"" },
            { name: "Crimson", price: 46000, img: "/image/crimson.png", desc: "THREE 80\" x 34\"" },
            { name: "Hawkins", price: 46000, img: "/image/hawkins.png", desc: "THREE 84\" x 34\"" },
            { name: "Byron", price: 42000, img: "/image/byron.jpg", desc: "THREE 75\" x 32\"" },
            { name: "Emperor", price: 46000, img: "/image/Emperor.png", desc: "THREE 84\" x 34\"" }
        ];

        const container = document.getElementById("product-container");

        products.forEach(p => {
            container.innerHTML += `
        <div class="cardone">
            <img src="${p.img}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p class="price">₹${p.price.toLocaleString()}</p>
            <p>${p.desc}</p>
            <button class="add-to-cart-btn"
                data-name="${p.name}"
                data-price="${p.price}"
                data-img="${p.img}">
                Add to Cart
            </button>
        </div>
    `;
        });

        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('nav-links');

            if (hamburger && navLinks) {
                hamburger.addEventListener('click', () => {
                    // Toggles the 'active' class to slide the mobile menu in/out
                    navLinks.classList.toggle('active');
                });

                // Optional: Close menu when a link is clicked
                navLinks.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        // Only close if the menu is active (mobile view)
                        if (navLinks.classList.contains('active')) {
                            navLinks.classList.remove('active');
                        }
                    });
                });
            }
        });
    </script>
</body>

</html>
