<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/image/logo.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/image/logo.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/image/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café-Furniture</title>
    <link rel="stylesheet" href="/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
    <script src="/utils.js"></script>
    <style>
        /* Base Reset */
        body,
        h1,
        h2,
        h3,
        p,
        a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            background: #f1f2f4;
        }

        /* 1. Navbar Styles (Desktop Default) */
        .navbar {
            display: flex;
            align-items: center;
            background: rgb(121, 65, 65);
            color: #fff;
            padding: 10px 20px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 60px;
            width: auto;
            display: block;
        }

        .location {
            font-size: 24px;
            margin-left: 15px;
            font-family: 'Protest Strike', sans-serif;
            line-height: 1.1;
        }

        /* Nav links (Desktop/Tablet default: visible and inline) */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            /* Use gap instead of margin-left */
            transition: all 0.3s ease-in-out;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #febd69;
        }

        /* 2. Hamburger Icon */
        .hamburger {
            display: none;
            /* Hidden on desktop/tablet by default */
            flex-direction: column;
            cursor: pointer;
            z-index: 1001;
        }

        .hamburger span {
            display: block;
            height: 3px;
            width: 25px;
            background: #fff;
            margin: 4px 0;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }

        /* Hamburger Active State (Icon to 'X') */
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* Mobile Menu Panel (Hidden by default on mobile) */
        .nav-links.active {
            display: flex !important;
            /* Force display to flex on mobile when active */
            flex-direction: column;
            width: 100%;
            background: rgb(80, 40, 40);
            position: fixed;
            top: 80px;
            /* Below navbar */
            left: 0;
            height: calc(100vh - 80px);
            padding: 20px 0;
            text-align: center;
            z-index: 999;
            gap: 20px;
        }

        .nav-links.active a {
            font-size: 20px;
        }


        /* 3. Card Grid Styles */
        .card-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* Desktop default */
            gap: 24px;
            justify-items: center;
            margin: 40px auto;
            padding: 0 12px;
            max-width: 1200px;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 280px;
            min-height: 380px;
            /* Increased min-height for uniform look */
            padding: 14px 10px 18px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .card img {
            width: 100%;
            height: 200px;
            max-width: 200px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p:not(.price) {
            flex-grow: 1;
            /* Pushes the button down */
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
        }

        .card .price {
            font-weight: bold;
            font-size: 1.1em;
            color: #c9302c;
            margin-bottom: 15px;
        }

        .card .add-to-cart-btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            background: rgb(121, 65, 65);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* 4. Responsive Rules */

        /* Tablet View (Max 1024px) */
        @media (max-width: 1024px) {
            .card-container {
                grid-template-columns: repeat(3, 1fr);
                /* 3 columns on larger tablets */
                max-width: 900px;
            }
        }

        /* Smaller Tablet View (Max 800px) */
        @media (max-width: 800px) {
            .card-container {
                grid-template-columns: repeat(2, 1fr);
                /* 2 columns on smaller tablets */
                gap: 20px;
            }
        }

        /* Mobile View (Max 768px) */
        @media (max-width: 768px) {

            /* HIDE NAV LINKS ON MOBILE (default state) */
            .nav-links {
                display: none;
                position: fixed;
                top: 80px;
                right: 0;
                width: 100%;
                height: calc(100vh - 80px);
                background: rgb(80, 40, 40);
                flex-direction: column;
                transform: translateX(100%);
                /* Start off-screen */
                transition: transform 0.3s ease-in-out;
            }

            /* SHOW HAMBURGER ICON ON MOBILE */
            .hamburger {
                display: flex;
            }

            /* MOBILE MENU ACTIVATED */
            .nav-links.active {
                display: flex !important;
                transform: translateX(0);
            }

            .card-container {
                grid-template-columns: 1fr;
                /* 1 column on mobile */
                max-width: 400px;
                margin: 20px auto;
            }

            .location {
                font-size: 18px;
            }

            .logo img {
                height: 50px;
            }
        }

        @media (max-width: 480px) {
            .location {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <script src="/auth.js"></script>
    <script src="/cart-logic.js"></script>
    <header class="navbar">
        <a href="/index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
            <div class="logo"><img src="/image/logo.png" alt="Logo"></div>
            <div class="location">Cluster Chairs</div>
        </a>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-links" id="nav-links">
            <a href="/login.html" id="account-link">Account & Lists</a>
            <a href="#" id="logout-link" style="display: none;">Logout</a>
            <a href="/cart.html" style="display: flex; align-items: center; text-decoration: none;">
                <img src="/image/cartimage.png" class="cart" style="height: 30px; vertical-align: middle;">
                <span id="cart-count" style="color:#fff; font-size:16px;">0</span>
            </a>
        </div>
    </header>

    <!-- CARD CONTAINER (JSON WILL FILL THIS) -->
    <div class="card-container" id="product-container"></div>

    <div id="cart-popup"
        style=" display:none; position:fixed; top:30px; right:30px; background:#232f3e; color:#fff; padding:16px 32px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15); font-size:1.1em; z-index:9999; transition:opacity 0.3s;">
    </div>

    <script>

        /* JSON PRODUCT LIST */
        const products = [
            {
                name: "Chikkana Computer Table",
                price: 15000,
                img: "/image/chikkan.jpg",
                desc: "Chikkana Compact Space Saving Computer Table SB 008"
            },
            {
                name: "Verner Computer Table",
                price: 15000,
                img: "/image/verner.jpg",
                desc: "Verner Computer Desk | Walnut"
            },
            {
                name: "Hutch Computer Table",
                price: 20000,
                img: "/image/hutch.jpg",
                desc: "Home Office Computer Table with Hutch"
            },
            {
                name: "Gaming Desk (Black)",
                price: 12000,
                img: "/image/gaming desk.jpg",
                desc: "Gaming desk, black, 160x80 cm"
            },
            {
                name: "Sit/Stand Gaming Table",
                price: 40000,
                img: "/image/gaming vesk.jpg",
                desc: "Electric adjustable gaming desk"
            },
            {
                name: "Computer Desk: Gaming",
                price: 40000,
                img: "/image/computerone.jpg",
                desc: "Gaming desk laptop table"
            },
            {
                name: "Gaming Table (Black)",
                price: 15000,
                img: "/image/computertwo.jpg",
                desc: "Gaming Table In Black Finish"
            }
        ];

        /* AUTO-GENERATE CARDS */
        products.forEach(p => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <img src="${p.img}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p class="price">₹${p.price.toLocaleString()}</p>
                <p>${p.desc}</p>
                <button class="add-to-cart-btn"
                    data-name="${p.name}"
                    data-price="${p.price}"
                    data-img="${p.img}">
                    Add to Cart
                </button>
            `;
            container.appendChild(card);
        });

        const hamburger = document.getElementById("hamburger");
        const navLinks = document.getElementById("nav-links");

        hamburger.addEventListener("click", () => {
            // Toggles the 'active' class on both elements
            navLinks.classList.toggle("active");
            hamburger.classList.toggle("active");
        });

        // Optional: Close menu when a link is clicked
        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                // Only close if the mobile menu is open
                if (navLinks.classList.contains('active')) {
                    navLinks.classList.remove('active');
                    hamburger.classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>
