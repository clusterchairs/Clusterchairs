<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clusterchairs</title>
    <script src="/utils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
    <style>
        body,
        h1,
        h2,
        h3,
        p,
        a {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f2f4;
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            background: rgb(121, 65, 65);
            color: #fff;
            padding: 10px 20px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .location {
            font-size: 36px;
            font-family: Protest Strike, sans-serif;
            line-height: 1.1;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #febd69;
        }

        .cart {
            width: 40px;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background: white;
        }

        @media (max-width: 768px) {
            .location {
                font-size: 24px;
            }

            .nav-links {
                position: absolute;
                top: 70px;
                right: 0;
                background: rgb(121, 65, 65);
                flex-direction: column;
                width: 200px;
                display: none;
                padding: 20px;
            }

            .nav-links.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }
        }

        /* Banner */
        .banner {
            text-align: center;
            position: relative;
        }

        .banner-content {
            background-image: url('image/banner.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: auto;
            min-height: 400px;
            aspect-ratio: 16/9;
            position: relative;
        }

        .banner-link-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .banner-link {
            position: absolute;
            display: block;
        }

        .couch-link {
            left: 30%;
            top: 25%;
            width: 20%;
            height: 15%;
        }

        .table-link {
            left: 65%;
            top: 55%;
            width: 15%;
            height: 10%;
        }

        .Officee-link {
            left: 0%;
            top: 35%;
            width: 20%;
            height: 20%;
        }

        .Office-link {
            left: 72%;
            top: 40%;
            width: 25%;
            height: 20%;
        }

        .tea-link {
            left: 35%;
            top: 48%;
            width: 20%;
            height: 12%;
        }

        .gaming-link {
            left: 45%;
            top: 1%;
            width: 25%;
            height: 20%;
        }

        .Computer-link {
            left: 2%;
            top: 1%;
            width: 25%;
            height: 25%;
        }

        .teas-link {
            left: 27%;
            top: 6%;
            width: 15%;
            height: 12%;
        }

        .banner-tooltip {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #222;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9em;
            white-space: nowrap;
        }

        .banner-link:hover .banner-tooltip {
            display: block;
        }

        /* Deals section */
        .deals-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .deals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            align-items: stretch;
        }

        @media (max-width: 900px) {
            .deals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .deals-grid {
                grid-template-columns: 1fr;
            }
        }

        .deal-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
            overflow: hidden;
            height: 100%;
        }

        .deal-card:hover {
            transform: scale(1.05);
            z-index: 2;
        }

        .deal-card h3 {
            font-size: 1.1em;
            margin: 12px 0;
            color: #232f3e;
        }

        .deal-items {
            position: relative;
            width: 100%;
            height: 250px;
        }

        .deal-items img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .see-offers-btn {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #111;
            border: 0;
            border-radius: 20px;
            padding: 6px 18px;
            font-size: 1em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .deal-items:hover .see-offers-btn {
            opacity: 1;
            pointer-events: auto;
        }

        /* -----------------------------
           🔥 Popular Products Carousel
        ------------------------------*/
        .popular-products {
            max-width: 1200px;
            margin: 60px auto;
            text-align: center;
            padding: 20px;
        }

        .popular-products h2 {
            font-family: Protest Strike, sans-serif;
            font-size: 2.2em;
            margin-bottom: 20px;
            color: #333;
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        .carousel-track {
            display: flex;
            width: 100%;
            height: auto;
            justify-content: center;
            align-items: center;
        }

        .carousel-slide {
            width: 100%;
            justify-content: space-evenly;
            flex-wrap: wrap;
            display: none;
            animation: fade 1s ease-in-out;
        }

        .carousel-slide.active {
            display: flex;
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .product-card {
            background: #fafafa;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 16px;
            width: 23%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h3 {
            font-size: 1.1em;
            margin: 10px 0 6px;
            color: #232f3e;
        }

        .product-card p {
            font-size: 0.9em;
            color: #555;
            margin: 2px 0;
        }

        .product-card button {
            margin-top: 10px;
            background: #7d4b4b;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .product-card button:hover {
            background: #5c3232;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(121, 65, 65, 0.8);
            color: #fff;
            border: none;
            font-size: 24px;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s;
        }

        .carousel-btn:hover {
            background: rgb(121, 65, 65);
        }

        .carousel-btn.prev {
            left: 15px;
        }

        .carousel-btn.next {
            right: 15px;
        }

        @media (max-width: 992px) {
            .product-card {
                width: 45%;
            }
        }

        @media (max-width: 768px) {
            .product-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="logo"><img src="/image/logo.png" alt="Logo"></div>
        <div class="location">Cluster Chairs</div>
        <div class="hamburger" id="hamburger">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="/login.html" id="account-link">Account & Lists</a>
            <a href="#" id="logout-link" style="display: none;">Logout</a>
            <a href="/cart.html">
                <img src="/image/cartimage.png" class="cart">
                <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Banner -->
    <section class="banner">
        <div class="banner-content">
            <div class="banner-link-area">
                <a href="/home-furniture.html" class="banner-link couch-link"><span class="banner-tooltip">Home
                        Furniture</span></a>
                <a href="/home-furniture.html" class="banner-link tea-link"><span class="banner-tooltip">Home
                        Furniture</span></a>
                <a href="/home-furniture.html" class="banner-link teas-link"><span class="banner-tooltip">Home
                        Furniture</span></a>
                <a href="/home-furniture.html" class="banner-link table-link"><span class="banner-tooltip">Home
                        Furniture</span></a>
                <a href="/gaming-furniture.html" class="banner-link gaming-link"><span
                        class="banner-tooltip">Gaming</span></a>
                <a href="/office-furniture.html" class="banner-link Office-link"><span
                        class="banner-tooltip">Office</span></a>
                <a href="/office-furniture.html" class="banner-link Officee-link"><span
                        class="banner-tooltip">Office</span></a>
                <a href="/computer-furniture.html" class="banner-link Computer-link"><span
                        class="banner-tooltip">Computer</span></a>
            </div>
        </div>
    </section>

    <!-- Deals -->
    <main>
        <div class="deals-main">
            <h3>Types of Furniture</h3>
            <div class="deals-grid">
                <a href="/cafe-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Cafe Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/cafe-chairs.jpg" alt="cafe">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
                <a href="/dinning-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Dining Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/dinning-furniture.jpg" alt="dining">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
                <a href="/home-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Home Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/home-furniture.jpg" alt="home">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
                <a href="/gaming-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Gaming Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/gaming-furniture.jpg" alt="gaming">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
                <a href="/office-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Office Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/office-furniture.jpg" alt="office">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
                <a href="/computer-furniture.html" style="text-decoration:none;color:inherit;">
                    <div class="deal-card">
                        <h3>Computer Furniture</h3>
                        <div class="deal-items">
                            <img src="/image/computer-furniture.jpg" alt="computer">
                            <button class="see-offers-btn">See all offers</button>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <!-- Popular Products Section -->
    <section class="popular-products">
        <h2><span style="color:#a05252;">Popular</span> Products</h2>

        <div class="carousel-container">
            <button class="carousel-btn prev">&#10094;</button>
            <div class="carousel-track" id="carousel-track"></div>
            <button class="carousel-btn next">&#10095;</button>
        </div>
    </section>

    <script>
        // Hamburger toggle
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('nav-links');
        hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));

        // Login and cart
        function handleLogout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const accountLink = document.getElementById('account-link');
            const logoutLink = document.getElementById('logout-link');
            if (token) {
                accountLink.style.display = 'none';
                logoutLink.style.display = 'inline';
                logoutLink.addEventListener('click', handleLogout);
            } else {
                accountLink.style.display = 'inline';
                logoutLink.style.display = 'none';
            }
        }

        function updateCartCount() {
            document.getElementById('cart-count').textContent = localStorage.getItem('cartCount') || 0;
        }

        window.addEventListener('load', () => {
            updateCartCount();
            checkLoginStatus();
        });

        window.addEventListener('storage', () => {
            updateCartCount();
            checkLoginStatus();
        });

        // Product Data
        const products = [
            { name: "Kelly HB Office Chair", image: "/image/chair1.jpg", country: "India", style: "Modern", color: "Black" },
            { name: "King Office Chair", image: "/image/chair2.jpg", country: "India", style: "Modern", color: "Brown" },
            { name: "Matrix MB Office Chair", image: "/image/chair3.jpg", country: "India", style: "Modern", color: "Black" },
            { name: "Olivia HB Office Chair", image: "/image/chair4.jpg", country: "India", style: "Modern", color: "Grey" },
            { name: "Crown Executive Chair", image: "/image/chair5.jpg", country: "India", style: "Luxury", color: "Tan" },
            { name: "Smart Ergonomic Chair", image: "/image/chair6.jpg", country: "India", style: "Contemporary", color: "Blue" },
            { name: "Wave HB Office Chair", image: "/image/chair7.jpg", country: "India", style: "Modern", color: "Red" },
            { name: "Prime Manager Chair", image: "/image/chair8.jpg", country: "India", style: "Classic", color: "Black" }
        ];

        const track = document.getElementById("carousel-track");

        for (let i = 0; i < products.length; i += 4) {
            const slide = document.createElement("div");
            slide.classList.add("carousel-slide");

            const group = products.slice(i, i + 4);
            group.forEach(prod => {
                const card = document.createElement("div");
                card.classList.add("product-card");
                card.innerHTML = `
                    <img src="${prod.image}" alt="${prod.name}">
                    <h3>${prod.name}</h3>
                    <p><b>Country:</b> ${prod.country}</p>
                    <p><b>Style:</b> ${prod.style}</p>
                    <p><b>Color:</b> ${prod.color}</p>
                    <button>Enquiry Now</button>
                `;
                slide.appendChild(card);
            });

            track.appendChild(slide);
        }

        const slides = document.querySelectorAll(".carousel-slide");
        const nextBtn = document.querySelector(".next");
        const prevBtn = document.querySelector(".prev");
        let currentIndex = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => slide.classList.toggle("active", i === index));
        }

        nextBtn.addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        });

        prevBtn.addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            showSlide(currentIndex);
        });

        // Ensure first slide visible
        setTimeout(() => showSlide(currentIndex), 200);

        // Optional auto-slide
        setInterval(() => {
            currentIndex = (currentIndex + 1) % slides.length;
            showSlide(currentIndex);
        }, 5000);
    </script>
</body>

</html>
