        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            background: rgb(121, 65, 65);
            color: #fff;
            padding: 10px 20px;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img {
            height: 80px;
            width: auto;
            display: block;
        }

        .location {
            font-size: 36px;

            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #febd69;
        }

        .cart {
            width: 40px;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .hamburger div {
            width: 25px;
            height: 3px;
            background: white;
        }

        @media (max-width: 768px) {
            .location {
                font-size: 24px;
            }

            .nav-links {
                position: absolute;
                top: 70px;
                right: 0;
                background: rgb(121, 65, 65);
                flex-direction: column;
                width: 200px;
                display: none;
                padding: 20px;
            }

            .nav-links.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }
        }

        /* Banner */
        .banner {
            text-align: center;
            position: relative;
        }

        .banner-content {
            background-image: url('image/banner.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            height: auto;
            min-height: 400px;
            aspect-ratio: 16/9;
            position: relative;
        }

        .banner-link-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .banner-link {
            position: absolute;
            display: block;
        }

            left: 30%;
            top: 25%;
            width: 20%;
            height: 15%;
        }

            top: 55%;

            top: 35%;

            height: 20%;

            height: 20%;

            top: 100%;
            left: 0;

            color: #fff;
            padding: 6px 14px;

            width: 100%;
            max-width: 1200px;
            align-items: stretch;

            .deals-grid {

        @media (max-width: 600px) {

            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;

            height: 100%;

        .deal-card:hover {

        }

            color: #232f3e;
        }

            width: 100%;
            height: 250px;
        }

        .deal-items img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
            display: block;
        }

        .see-offers-btn {

            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #111;

            opacity: 0;

            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .deal-items:hover .see-offers-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .carousel-container {
            position: relative;
            max-width: 1200px;
            margin: auto;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-slide {
            min-width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .carousel-slide.active {
            opacity: 1;
        }

            background: #f8f8f8;

        function handleLogout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function checkLoginStatus() {
            const token = localStorage.getItem('token');
            const accountLink = document.getElementById('account-link');
            const logoutLink = document.getElementById('logout-link');
            if (token) {
                accountLink.style.display = 'none';
                logoutLink.style.display = 'inline';
                logoutLink.addEventListener('click', handleLogout);
            } else {
                accountLink.style.display = 'inline';
                logoutLink.style.display = 'none';
            }
        }

        function updateCartCount() {
            document.getElementById('cart-count').textContent = localStorage.getItem('cartCount') || 0;
        }

            updateCartCount();
            checkLoginStatus();
        });

        { name: "Smart Ergonomic Chair", image: "/image/slideshow/76.png", country: "India", style: "Contemporary", color: "Blue" },
        { name: "Wave HB Office Chair", image: "/image/slideshow/77.png", country: "India", style: "Modern", color: "Red" },
        { name: "Prime Manager Chair", image: "/image/slideshow/78.png", country: "India", style: "Classic", color: "Black" },
        { name: "Wave HB Office Chair", image: "/image/slideshow/79.png", country: "India", style: "Modern", color: "Red" },
        { name: "Prime Manager Chair", image: "/image/slideshow/80.png", country: "India", style: "Classic", color: "Black" },
        // Add more...
    ];

    // 🧩 Create cards inside carousel
    const track = document.getElementById("carousel-track");
    products.forEach(prod => {
        const card = document.createElement("div");
        card.classList.add("product-card");
        card.innerHTML = `
            <img src="${prod.image}" alt="${prod.name}">
            <h3>${prod.name}</h3>
            <p><b>Country:</b> ${prod.country}</p>
            <p><b>Style:</b> ${prod.style}</p>
            <p><b>Color:</b> ${prod.color}</p>
            <button>Enquiry Now</button>
        `;
        track.appendChild(card);
    });

    // 🧭 Carousel logic
    const nextBtn = document.querySelector(".next");
    const prevBtn = document.querySelector(".prev");
    let currentIndex = 0;

    function updateCarousel() {
        const cardWidth = track.querySelector(".product-card").offsetWidth + 20; // card + gap
        track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
    }

    nextBtn.addEventListener("click", () => {
        const cards = document.querySelectorAll(".product-card").length;
        if (currentIndex < cards - 1) {
            currentIndex++;
        } else {
            currentIndex = 0; // loop to start
        }
        updateCarousel();
    });

    prevBtn.addEventListener("click", () => {
        const cards = document.querySelectorAll(".product-card").length;
        if (currentIndex > 0) {
            currentIndex--;
        } else {
            currentIndex = cards - 1; // loop to end
        }
        updateCarousel();
    });

    // 🌀 Auto-slide every 5s
    setInterval(() => {
        const cards = document.querySelectorAll(".product-card").length;
        currentIndex = (currentIndex + 1) % cards;
        updateCarousel();
    }, 4000);

    window.addEventListener("resize", updateCarousel);
    updateCarousel();
    </script>
</body>

</html>
