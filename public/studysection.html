<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/image/logo.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/image/logo.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/image/logo.png">
  <title>Cafe-Furniture</title>
  <script src="/utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Protest+Strike&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgb(121, 65, 65);
      color: #fff;
      padding: 10px 20px;
    }

    .navbar .logo img {
      height: 40px;
    }

    .location {
      font-size: 20px;
      font-weight: bold;
      margin-left: 10px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }

    .cart {
      width: 40px;
    }

    /* Hamburger menu */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background: #fff;
      border-radius: 2px;
    }

    /* Card container */
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.2s;
    }

    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .card h3 {
      margin: 10px 0;
      font-size: 18px;
    }

    .card .price {
      color: #444;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .card button {
      background: rgb(121, 65, 65);
      color: #fff;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
    }

    .card button:hover {
      background: #37475a;
    }

    /* Responsive Navbar */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 60px;
        right: 0;
        background: rgb(121, 65, 65);
        flex-direction: column;
        width: 200px;
        padding: 15px;
        gap: 15px;
        border-radius: 0 0 10px 10px;
      }

      .nav-links.active {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <script src="/auth.js"></script>
  <script src="/cart-logic.js"></script>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
      <div class="logo"><img src="/image/logo.png" alt="Logo"></div>
      <div class="location">Cluster Chairs</div>
    </a>

    <div class="nav-links" id="nav-links">
      <a href="/login.html" id="account-link">Account & Lists</a>
      <a href="#" id="logout-link" style="display: none;">Logout</a>
      <a href="/cart.html">
        <img src="/image/cartimage.png" class="cart" style="vertical-align: middle;">
        <span id="cart-count"
          style="color: #fff; border-radius: 50%; padding: 2px 6px; margin-left: 4px; font-size: 16px;">0</span>
      </a>
    </div>

    <div class="hamburger" id="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </header>

  <!-- Cards will be inserted here -->
  <div class="card-container" id="card-container"></div>

  <div id="cart-popup"
    style="display:none; position:fixed; top:30px; right:30px; background:#232f3e; color:#fff; padding:16px 32px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,0.15); font-size:1.1em; z-index:9999; transition:opacity 0.3s;">
  </div>

  <script>
    // Hamburger toggle
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));

    // ✅ JSON data for products
    const products = [
      { name: "Century", price: 4000, image: "/image/century.png" },
      { name: "Timber", price: 4250, image: "/image/timber.png" },
      { name: "EVO", price: 6000, image: "/image/evo.png" },
      { name: "Premier", price: 4500, image: "/image/premier.png" },
      { name: "Addon", price: 4500, image: "/image/addon.png" },
      { name: "Prime Tab", price: 3000, image: "/image/prime tab.png" },
    ];

    // ✅ Generate cards dynamically
    const container = document.getElementById('card-container');
    products.forEach(prod => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.innerHTML = `
      <img src="${prod.image}" alt="${prod.name}">
      <h3>${prod.name}</h3>
      <p class="price">₹${prod.price.toLocaleString()}</p>
      <button class="add-to-cart-btn" data-name="${prod.name}" data-price="${prod.price}" data-img="${prod.image}">
        Add to Cart
      </button>
    `;
      container.appendChild(card);
    });

    // ✅ Ensure Add-to-Cart logic only attaches ONCE
    // Wait for cart-logic.js to load, then manually initialize new buttons
    window.addEventListener("load", () => {
      // Select all add-to-cart buttons
      const buttons = document.querySelectorAll(".add-to-cart-btn");

      buttons.forEach(btn => {
        // Remove any existing event listeners to avoid double triggers
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);

        // Attach a single click event
        newBtn.addEventListener("click", () => {
          const name = newBtn.dataset.name;
          const price = parseInt(newBtn.dataset.price);
          const img = newBtn.dataset.img;

          // ✅ Call the same function your cart-logic.js uses
          if (typeof addToCart === "function") {
            addToCart(name, price, img);
          } else {
            // Fallback: basic localStorage-based cart (in case JS not loaded)
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push({ name, price, img });
            localStorage.setItem("cart", JSON.stringify(cart));

            const count = cart.length;
            localStorage.setItem("cartCount", count);
            document.getElementById("cart-count").textContent = count;
          }
        });
      });
    });
  </script>

</body>

</html>
